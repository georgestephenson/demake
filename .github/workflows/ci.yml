name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (doc 11 §hygiene).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (project references)
        run: pnpm build
      - name: ESLint + Prettier
        run: pnpm lint

  test-unit:
    name: Unit (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first so the spawned-binary surface test runs against real dist.
      - run: pnpm build
      - run: pnpm test

  test-browser:
    name: "Browser (Playwright: determinism + functional)"
    runs-on: ubuntu-latest
    # doc 07 §Principles + doc 10 §Determinism: the web app must produce
    # byte-identical output to the CLI, in three independent engines.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install browsers
        run: pnpm --filter @demake/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - name: JS budget (doc 07 §Quality bar)
        run: pnpm build:web && node tools/ci/check-web-budget.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse budget (web)
    runs-on: ubuntu-latest
    # The site is built here rather than inside Lighthouse's `startServerCommand`,
    # so the server-ready window never races a compile, and it is audited at the
    # `/demake/` base Pages actually serves it from.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:web
      # Three runs, asserted against the best of them (lhci's default
      # `optimistic` aggregation for a `minScore`). Noise on a shared runner
      # only ever makes a page look slower than it is, so the least-contaminated
      # run is the truthful measurement — and a real regression drags all three.
      - name: Audit the static site
        run: pnpm --filter @demake/web exec lhci autorun
        env:
          # Actions sets CI=1, which makes Vite colourise its startup banner:
          # "Local:" arrives as "Local\e[22m:", so a ready-pattern matching the
          # literal text never fires and Lighthouse audits a port nothing is on.
          NO_COLOR: "1"
      - name: Keep the report when the audit fails
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-report
          path: |
            packages/web/.lighthouseci
            packages/web/lighthouse-report
          retention-days: 7
          if-no-files-found: ignore

  test-e2e:
    name: Pixel-perfect E2E (ROM → emulator)
    runs-on: ubuntu-latest
    # The ROM + emulator loop of doc 10: assemblers and libretro cores are built
    # from source (or installed from the distro archive) and cached, then the
    # same `pnpm test` runs with every self-skipping E2E enabled. This is what
    # makes "supported" mean supported (doc 13 §Phase 2).
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Cache toolchains + emulator cores
        uses: actions/cache@v4
        with:
          path: ~/.cache/demake/toolchains
          key: demake-tc-${{ runner.os }}-${{ hashFiles('tools/toolchains/**', 'emu-harness/**') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Strict here, best-effort everywhere else: the provisioners are designed
      # to never break a developer's session or a SessionStart hook, but in CI a
      # toolchain that fails to build must fail *at this step*, with its build
      # log, instead of surfacing later as a mystery.
      - name: Provision assemblers (RGBDS, cc65, WLA-DX, m68k, ARM, NASM)
        run: pnpm toolchains
        env:
          RGBDS_STRICT: "1"
          CC65_STRICT: "1"
          WLADX_STRICT: "1"
          M68K_STRICT: "1"
          ARM_STRICT: "1"
          NASM_STRICT: "1"
      - name: Provision emulators (SameBoy + libretro cores)
        run: pnpm emulator
        env:
          SAMEBOY_STRICT: "1"
          LIBRETRO_STRICT: "1"
      - name: Fail if any console E2E would silently self-skip
        run: node tools/ci/check-e2e-ready.mjs
      - run: pnpm test
