name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (doc 11 §hygiene).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Affected gates
    runs-on: ubuntu-latest
    # Which gates this change can actually break, derived from the workspace
    # dependency graph rather than a hand-written path list (doc 11 §Affected-only
    # gates). A push to `main` passes no base ref, so `main` always runs the whole
    # matrix: the PR is what gets fast, the branch releases are cut from stays
    # fully proven.
    outputs:
      unit: ${{ steps.affected.outputs.unit }}
      browser: ${{ steps.affected.outputs.browser }}
      lighthouse: ${{ steps.affected.outputs.lighthouse }}
      e2e: ${{ steps.affected.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The base commit has to be in the clone for `git diff base...HEAD` to
          # answer; without it the script fails open and runs everything.
          fetch-depth: 0
      - id: affected
        run: node tools/ci/affected.mjs
        env:
          DEMAKE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    # Never gated: it is forty seconds and it is the one job that reads every
    # file in the repo, including the paths the affected script calls inert.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (project references)
        run: pnpm build
      - name: ESLint + Prettier
        run: pnpm lint

  test-unit:
    name: Unit (${{ matrix.os }}, Node ${{ matrix.node }}, ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ${{ matrix.os }}
    # Three operating systems on `main`, one on a pull request — the same split
    # `affected.mjs` already states in its own header: the PR is what gets fast,
    # and the branch releases are cut from stays fully proven. What the other two
    # catch is path handling and line endings at the edges, which a merge to
    # `main` still finds before anything ships; what they cost on a PR is the
    # whole run, because Windows is the slowest runner and this is the longest
    # job on it. `fromJSON` because a matrix dimension has to be a real list.
    #
    # Node 22 is the floor and 24 is the ceiling, and on a pull request only the
    # floor runs — the OS split's argument, applied to the other axis. What the
    # second version catches is a change in the runtime's own behaviour under
    # code that is otherwise identical, which is a `main` concern rather than a
    # per-commit one, and it is the whole suite again either way.
    #
    # **Four shards, because the suite is 45 core-minutes and a runner has four
    # cores.** Vitest distributes whole files, so the floor is the slowest single
    # file rather than the total — which is exactly why the batteries are one file
    # per console (`_audio-battery.ts` §Why this is a battery rather than a test
    # file) and why sharding is worth anything at all here. Two things to know
    # before changing the count. The split is by SHA-1 of each file's path, so it
    # is arbitrary rather than balanced: the shards do not take equal times and the
    # slowest one is what the job costs. And every shard pays the setup again
    # (checkout, install, build), so past four the setup starts to dominate what
    # is left of the tail.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        node: ${{ fromJSON(github.event_name == 'pull_request' && '[22]' || '[22,24]') }}
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first so the spawned-binary surface test runs against real dist.
      - run: pnpm build
      # A shard of the suite's files, never a subset chosen by what changed:
      # `vitest.config.ts` aliases every `@demake/*` specifier to source, so a test
      # can import a package its own package.json does not declare. Job-level
      # gating only ever asks whether a package is in the closure, which that
      # hazard cannot affect — and a shard is every file in turn, so it cannot
      # either.
      - run: pnpm test --shard=${{ matrix.shard }}/4

  test-browser:
    name: "Browser (${{ matrix.browser }}, ${{ matrix.shard }}/2)"
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    # doc 07 §Principles + doc 10 §Determinism: the web app must produce
    # byte-identical output to the CLI, in three independent engines. One job per
    # engine — the three ran sequentially inside a single job for five and a half
    # minutes, which was the whole run's critical path while every other job had
    # been finished for three.
    #
    # And two shards per engine, because that job became the critical path the
    # moment the unit suite was sharded: Firefox was fifteen minutes of a
    # twenty-one-minute run. Playwright shards *tests* rather than files under
    # `fullyParallel`, and `determinism.spec.ts` is a test per console with a
    # backend — a dozen cases of roughly equal cost, which is the shape sharding
    # divides best. Unlike the unit suite's four this is not floored by one long
    # file, so the limit here is the browser install rather than the balance.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache the browser download
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @demake/web exec playwright install --with-deps ${{ matrix.browser }}
      # The download is cacheable; the apt packages it needs are not, so a cache
      # hit still has to put the system libraries back (WebKit is the one this
      # matters for).
      - name: Install the browser's system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @demake/web exec playwright install-deps ${{ matrix.browser }}
      # No `--` before the flag: this script is a `pnpm --filter` delegation, so a
      # separator survives the hand-off and reaches Playwright as a positional
      # filter that matches no test.
      - run: pnpm test:browser --shard=${{ matrix.shard }}/2
        env:
          DEMAKE_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: packages/web/playwright-report
          retention-days: 7

  web-quality:
    name: Web budget & Lighthouse
    needs: changes
    if: needs.changes.outputs.lighthouse == 'true'
    runs-on: ubuntu-latest
    # The site is built here rather than inside Lighthouse's `startServerCommand`,
    # so the server-ready window never races a compile, and it is audited at the
    # `/demake/` base Pages actually serves it from. The JS budget rides along
    # because it needs the same build and nothing else: it was costing the browser
    # job a second `build:web` after the Playwright run.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:web
      - name: JS budget (doc 07 §Quality bar)
        run: node tools/ci/check-web-budget.mjs
      # Three runs, asserted against the best of them (lhci's default
      # `optimistic` aggregation for a `minScore`). Noise on a shared runner
      # only ever makes a page look slower than it is, so the least-contaminated
      # run is the truthful measurement — and a real regression drags all three.
      - name: Audit the static site
        run: pnpm --filter @demake/web exec lhci autorun
        env:
          # Actions sets CI=1, which makes Vite colourise its startup banner:
          # "Local:" arrives as "Local\e[22m:", so a ready-pattern matching the
          # literal text never fires and Lighthouse audits a port nothing is on.
          NO_COLOR: "1"
      - name: Keep the report when the audit fails
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-report
          path: |
            packages/web/.lighthouseci
            packages/web/lighthouse-report
          retention-days: 7
          if-no-files-found: ignore

  test-e2e:
    name: Pixel-perfect E2E (ROM → emulator)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # The ROM + emulator loop of doc 10: assemblers and libretro cores are built
    # from source (or installed from the distro archive) and cached, then the
    # self-skipping E2E suites run with every one of them present. This is what
    # makes "supported" mean supported (doc 13 §Phase 2).
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Cache toolchains + emulator cores
        uses: actions/cache@v4
        with:
          path: ~/.cache/demake/toolchains
          key: demake-tc-${{ runner.os }}-${{ hashFiles('tools/toolchains/**', 'emu-harness/**') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Strict here, best-effort everywhere else: the provisioners are designed
      # to never break a developer's session or a SessionStart hook, but in CI a
      # toolchain that fails to build must fail *at this step*, with its build
      # log, instead of surfacing later as a mystery.
      - name: Provision assemblers (RGBDS, cc65, WLA-DX, m68k, ARM, NASM)
        run: pnpm toolchains
        env:
          RGBDS_STRICT: "1"
          CC65_STRICT: "1"
          WLADX_STRICT: "1"
          M68K_STRICT: "1"
          ARM_STRICT: "1"
          NASM_STRICT: "1"
      - name: Provision emulators (SameBoy + libretro cores)
        run: pnpm emulator
        env:
          SAMEBOY_STRICT: "1"
          LIBRETRO_STRICT: "1"
      - name: Fail if any console E2E would silently self-skip
        run: node tools/ci/check-e2e-ready.mjs
      # Only the suites that need a toolchain. This job used to run `pnpm test`,
      # which re-ran the entire unit suite a second time on the same runner
      # image the `Unit (ubuntu-latest, Node 22)` job had already run it on —
      # and no test outside a `*.e2e.test.ts` behaves differently for having an
      # assembler on PATH.
      - run: pnpm test:rom-e2e

  gate:
    name: CI gate
    if: always()
    needs: [changes, lint, test-unit, test-browser, web-quality, test-e2e]
    runs-on: ubuntu-latest
    # One check name for branch protection to require, so which jobs a PR skips
    # is a CI decision rather than something a human has to keep in the repo
    # settings. A skipped job is a pass; anything else — failed, cancelled,
    # timed out — is not.
    steps:
      - name: Require every job that ran to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          bad=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "  \(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "These jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "Every job that ran passed."
